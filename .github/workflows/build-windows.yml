name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/build-windows.yml' ]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get
      - name: Patch MSVC coroutine compat
        shell: pwsh
        run: |
          $cacheRoot = Join-Path $env:LOCALAPPDATA 'Pub\Cache\hosted\pub.dev'
          $dirs = Get-ChildItem -Path $cacheRoot -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -like 'flutter_inappwebview_windows-*' }
          foreach ($d in $dirs) {
            $cmake = Join-Path $d.FullName 'windows\CMakeLists.txt'
            if (Test-Path $cmake) {
              $content = Get-Content -LiteralPath $cmake -Raw
              $patch = "# silence experimental coroutine deprecation (MSVC STL1011)`nadd_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)`n"
              if ($content -notmatch 'SILENCE_EXPERIMENTAL_COROUTINE') {
                Set-Content -LiteralPath $cmake -Value ($patch + $content) -Encoding UTF8
                Write-Output "patched: $($d.Name)"
              } else {
                Write-Output "already patched: $($d.Name)"
              }
            }
          }
      - name: Build Windows
        run: |
          cd simple_live_app
          flutter build windows --release
      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "simple_live_app/build/windows/x64/runner/Release/*" -DestinationPath "simple_live_windows.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_windows
          path: simple_live_windows.zip

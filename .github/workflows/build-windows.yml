name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths: [ '.github/workflows/build-windows.yml' ]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
      - name: Restore packages
        run: |
          cd simple_live_app
          flutter pub get
      - name: Patch MSVC coroutine compat
        shell: pwsh
        run: |
          $macro = 'add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)'
          $runner = 'simple_live_app/windows/CMakeLists.txt'
          if (Test-Path $runner) {
            $c = Get-Content -LiteralPath $runner -Raw
            if ($c -notmatch 'SILENCE_EXPERIMENTAL_COROUTINE') {
              $c = $c -replace '(?m)(^cmake_minimum_required\([^\r\n]+\)\r?\n)', "$1`n$macro`n"
              Set-Content -LiteralPath $runner -Value $c -Encoding UTF8
              Write-Output 'patched runner CMakeLists'
            } else {
              Write-Output 'runner already patched'
            }
          }
          $cacheRoot = Join-Path $env:LOCALAPPDATA 'Pub\Cache\hosted\pub.dev'
          $files = Get-ChildItem -Path $cacheRoot -Recurse -Filter 'CMakeLists.txt' -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match '\\windows\\CMakeLists\.txt$' }
          foreach ($f in $files) {
            $content = Get-Content -LiteralPath $f.FullName -Raw
            if ($content -notmatch 'SILENCE_EXPERIMENTAL_COROUTINE') {
              $content = $content -replace '(?m)(^cmake_minimum_required\([^\r\n]+\)\r?\n)', "$1`n$macro`n"
              Set-Content -LiteralPath $f.FullName -Value $content -Encoding UTF8
              Write-Output "patched plugin: $($f.Directory.Parent.Parent.Name)"
            } else {
              Write-Output "already patched: $($f.Directory.Parent.Parent.Name)"
            }
          }
      - name: Build Windows
        run: |
          cd simple_live_app
          flutter build windows --release
      - name: Package ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "simple_live_app/build/windows/x64/runner/Release/*" -DestinationPath "simple_live_windows.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple_live_windows
          path: simple_live_windows.zip
